<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 결·보강 도우미</title>
    <!-- SheetJS 엑셀 파싱 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a; 
            --card-bg: #1e293b; 
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --purple: #a855f7;
            --gray-btn: #475569;
        }

        body { 
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif; 
            background-color: var(--bg-dark); color: var(--text-main); 
            margin: 0; padding: 25px 20px 60px 20px; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; box-sizing: border-box; 
        }

        .header { text-align: center; margin-bottom: 25px; width: 100%; max-width: 1400px; }
        .header h1 { font-size: 2.2rem; margin: 0; font-weight: 900; color: white; letter-spacing: -1px; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        .main-container {
            width: 100%; max-width: 1500px; display: grid; grid-template-columns: 360px 1fr; gap: 25px; align-items: start;
        }

        .panel { 
            background: var(--card-bg); padding: 25px; 
            border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); 
            border: 1px solid var(--card-border); 
        }
        .panel-title { 
            font-size: 1.15rem; font-weight: 800; margin-top: 0; margin-bottom: 20px; 
            color: var(--primary); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px;
        }

        .left-sidebar { display: flex; flex-direction: column; gap: 20px; }
        
        .upload-area { display: flex; gap: 10px; align-items: center; flex-direction: column; }
        .file-input-wrapper { width: 100%; }
        
        .file-input-btn { 
            display: flex; justify-content: center; align-items: center; width: 100%; padding: 14px; 
            background: rgba(0,0,0,0.3); border: 2px dashed rgba(255,255,255,0.2); border-radius: 8px; 
            text-align: center; color: var(--text-dim); cursor: pointer; transition: all 0.2s; 
            font-weight: 600; font-size: 0.95rem; box-sizing: border-box;
            white-space: normal; word-break: keep-all; line-height: 1.4;
        }
        .file-input-btn:hover { border-color: var(--primary); color: var(--primary); background: rgba(56, 189, 248, 0.05); }
        .file-input-btn.loaded { border-color: var(--success); color: var(--success); background: rgba(16, 185, 129, 0.08); border-style: solid; }

        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
        .form-group label { font-weight: 700; color: var(--text-dim); font-size: 0.9rem; }
        select, input[type="date"] { 
            width: 100%; padding: 12px 14px; background: rgba(0,0,0,0.3); 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; 
            color: var(--text-main); font-size: 0.95rem; outline: none; font-family: inherit; box-sizing: border-box; 
        }
        select:focus, input[type="date"]:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        select:disabled, input[type="date"]:disabled { opacity: 0.4; cursor: not-allowed; }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1) brightness(0.9); cursor: pointer; opacity: 0.8; transition: opacity 0.2s;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }

        #dateInputsContainer { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .date-input-row { display: flex; flex-direction: column; gap: 8px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .date-controls { display: flex; gap: 8px; align-items: center; }
        
        .date-options { display: flex; align-items: flex-start; gap: 8px; font-size: 0.85rem; color: var(--warning); padding-left: 2px; line-height: 1.4; word-break: keep-all; }
        .date-options input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--warning); cursor: pointer; margin-top: 2px; flex-shrink: 0; }

        .class-checkbox-container {
            background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05);
            padding: 15px; border-radius: 10px; margin-bottom: 15px; display: none;
        }
        .class-checkbox-title { font-size: 0.9rem; font-weight: 700; color: var(--primary); margin-bottom: 10px; }
        .date-group-label { font-size: 0.85rem; color: #cbd5e1; font-weight: bold; margin-top: 10px; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px dashed rgba(255,255,255,0.1); }
        .class-checkbox-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .class-checkbox-item {
            background: rgba(255,255,255,0.05); padding: 10px 12px; border-radius: 6px;
            display: flex; align-items: center; gap: 10px; font-size: 0.9rem; cursor: pointer; border: 1px solid transparent; transition: all 0.2s;
        }
        .class-checkbox-item:hover { background: rgba(255,255,255,0.1); }
        .class-checkbox-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0;}

        /* 확장 검색 토글 스위치 영역 */
        .extend-search-wrapper {
            margin-top: 10px; margin-bottom: 15px; padding: 12px; border-radius: 8px; 
            background: rgba(168, 85, 247, 0.1); border: 1px dashed rgba(168, 85, 247, 0.4);
            display: none;
        }
        .extend-search-label {
            display: flex; align-items: center; gap: 8px; font-size: 0.95rem; color: #c084fc; font-weight: 800; cursor: pointer;
        }
        .extend-search-label input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--purple); cursor: pointer; }

        /* 버튼류 */
        .btn { padding: 10px 16px; font-size: 0.9rem; font-weight: 800; color: white; background: var(--primary); border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .btn:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(56, 189, 248, 0.3); }
        .btn.action { background: var(--success); }
        .btn.action:hover:not(:disabled) { background: #059669; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }
        .btn.purple { background: var(--purple); }
        .btn.purple:hover:not(:disabled) { background: #9333ea; box-shadow: 0 4px 10px rgba(168, 85, 247, 0.3); }
        .btn.danger { background: var(--danger); padding: 8px 12px; font-size: 0.8rem; }
        .btn.danger:hover:not(:disabled) { background: #dc2626; }
        .btn.secondary { background: var(--gray-btn); }
        .btn.secondary:hover:not(:disabled) { background: #334155; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        /* 우측: 대기 화면 */
        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; min-height: 500px; background: rgba(30, 41, 59, 0.4); 
            border: 2px dashed rgba(255,255,255,0.1); border-radius: 16px;
            color: var(--text-dim); text-align: center; padding: 40px; box-sizing: border-box; animation: fadeIn 0.5s ease;
        }
        .empty-state .icon { font-size: 4rem; margin-bottom: 20px; opacity: 0.8; }
        .empty-state h3 { font-size: 1.5rem; color: white; margin-top: 0; margin-bottom: 12px; }
        .empty-state p { font-size: 1rem; line-height: 1.6; margin: 0; word-break: keep-all; }

        /* 우측: 결과 패널 */
        .right-content { display: none; flex-direction: column; gap: 20px; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        .result-panel {
            background: linear-gradient(145deg, #1e293b, #0f172a); 
            border: 1px solid rgba(56, 189, 248, 0.3); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 20px rgba(56, 189, 248, 0.15);
            padding: 30px; border-radius: 16px; position: relative; overflow: hidden; width: 100%; box-sizing: border-box;
        }
        .result-panel::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--purple));
        }

        .accordion-item {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px; overflow: hidden; margin-bottom: 12px; transition: all 0.2s;
        }
        .accordion-header {
            padding: 16px 20px; background: rgba(255,255,255,0.02); cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; gap: 15px;
            user-select: none; border-left: 4px solid var(--primary);
        }
        .accordion-header:hover { background: rgba(255,255,255,0.08); }
        .accordion-title { font-size: 1.05rem; font-weight: 800; color: white; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .accordion-sub { font-size: 0.9rem; color: #38bdf8; font-weight: 700; margin-top: 4px; }
        .accordion-icon { font-size: 1.1rem; color: var(--text-dim); transition: transform 0.3s; }
        .accordion-item.active .accordion-icon { transform: rotate(180deg); color: var(--primary); }

        .accordion-body {
            display: none; padding: 15px 20px; background: rgba(0,0,0,0.15);
            max-height: 400px; overflow-y: auto; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .accordion-item.active .accordion-body { display: block; animation: fadeIn 0.3s ease; }
        /* 스크롤바 꾸미기 */
        .accordion-body::-webkit-scrollbar { width: 8px; }
        .accordion-body::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
        .accordion-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        .candidate-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
        .candidate-card {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
            padding: 14px 18px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; transition: all 0.2s;
        }
        .candidate-card:hover:not(.locked-card) { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); }
        .candidate-card.selected { border-color: var(--success); background: rgba(16, 185, 129, 0.1); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.15); }
        .candidate-card.locked-card { opacity: 0.4; background: rgba(0,0,0,0.4); border-color: transparent; filter: grayscale(100%); }

        .t-name { font-size: 1.05rem; font-weight: 800; color: white; display: flex; align-items: center; gap: 6px; }
        .t-tag { font-size: 0.95rem; color: var(--text-dim); margin-top: 5px; letter-spacing: -0.3px; }
        .dept-tag { font-size: 0.7rem; padding: 2px 5px; border-radius: 4px; font-weight: 700; background: rgba(99, 102, 241, 0.2); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }
        .tag-rank1 { background: rgba(16, 185, 129, 0.2); color: #34d399; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: 800; }
        .tag-special { background: rgba(168, 85, 247, 0.2); color: #c084fc; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: 800; border: 1px solid rgba(168, 85, 247, 0.3); }

        .workload-badge { display: inline-block; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: 700; margin-left: 6px; }
        .workload-normal { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
        .workload-heavy { background: rgba(245, 158, 11, 0.25); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
        .workload-danger { background: rgba(244, 63, 94, 0.25); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.4); }
        .my-workload-badge { display: inline-block; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: 700; margin-left: 4px; background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }

        .deep-swap-box { background: rgba(168, 85, 247, 0.12); border: 1px dashed var(--purple); padding: 18px; border-radius: 10px; margin-top: 12px; line-height: 1.5; font-size: 0.95rem;}

        /* 서식 뷰어 스타일 */
        .form-viewer {
            background: white; color: black; padding: 30px 25px; border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); 
            font-family: 'Batang', '바탕', 'Malgun Gothic', serif; width: 100%; box-sizing: border-box;
        }
        .form-viewer h2 { text-align: center; font-size: 1.6rem; margin-top: 0; margin-bottom: 20px; color: #1e293b; border-bottom: 2px solid #cbd5e1; padding-bottom: 12px; font-weight: 900; }
        
        .alert-box {
            background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: var(--danger);
            padding: 12px 15px; border-radius: 8px; font-size: 0.95rem; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .hwp-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 10.5pt; border-top: 2px solid black; border-bottom: 2px solid black; margin-bottom: 20px; }
        .hwp-table th, .hwp-table td { border: 1px solid black; padding: 12px 6px; vertical-align: middle; }
        .hwp-table th { background-color: #f1f5f9; font-weight: bold; }

        .validation-box {
            display: none; margin-top: 20px; padding: 18px; border-radius: 10px; font-size: 1rem; font-weight: bold; line-height: 1.6; text-align: center;
        }
        
        @media (max-width: 1100px) {
            .main-container { grid-template-columns: 1fr; }
            .empty-state { min-height: 300px; padding: 30px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🗓️ 스마트 결·보강 도우미</h1>
    </div>

    <div class="main-container">
        <!-- 💡 좌측: 파일 & 설정 패널 -->
        <div class="left-sidebar">
            <div class="panel">
                <h2 class="panel-title">
                    <span>1. 시간표 로드</span>
                    <button class="btn danger" id="resetBtn" style="display:none;" onclick="clearStorage()">초기화</button>
                </h2>
                <div class="upload-area">
                    <div class="file-input-wrapper">
                        <label for="excelUpload" class="file-input-btn" id="uploadLabel">
                            📁 엑셀 파일(.xlsx) 수동 업로드
                        </label>
                        <input type="file" id="excelUpload" accept=".xlsx, .xls, .csv" style="display:none;">
                    </div>
                </div>
            </div>

            <div class="panel" id="searchPanel" style="opacity: 0.4; pointer-events: none; transition: 0.3s;">
                <h2 class="panel-title">2. 결강 설정</h2>
                
                <div class="form-group">
                    <label>결강 교사</label>
                    <select id="teacherSelect" disabled onchange="renderCheckboxes()">
                        <option value="">교사 선택</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label style="display:flex; justify-content:space-between; align-items:center;">
                        결강 일자
                        <button class="btn secondary" style="padding:4px 8px; font-size:0.75rem;" onclick="addDateInput()">+ 일자 추가</button>
                    </label>
                    <div id="dateInputsContainer">
                        <!-- 동적 날짜 입력 행 생성 -->
                    </div>
                </div>

                <div class="class-checkbox-container" id="classCheckboxContainer">
                    <div class="class-checkbox-title">📌 변경할 수업 선택</div>
                    <div id="dynamicCheckboxArea"></div>
                </div>

                <!-- 🔥 확장 검색 토글 -->
                <div class="extend-search-wrapper" id="extendSearchWrapper">
                    <label class="extend-search-label">
                        <input type="checkbox" id="extendSearchCb"> 
                        이번 학기 끝(2027.01.07)까지 확장 검색하기
                    </label>
                </div>

                <button class="btn" id="searchBtn" style="width: 100%; padding: 16px; font-size: 1.15rem;" disabled onclick="findReplacements()">
                    대체 수업 추천받기 🔍
                </button>
            </div>
        </div>

        <!-- 💡 우측: 대기 화면 -->
        <div class="empty-state" id="emptyStatePanel">
            <div class="icon">🔍</div>
            <h3>대기 중입니다</h3>
            <p>좌측 패널에서 결강 교사와 일자를 설정하신 후<br><strong>[대체 수업 추천받기]</strong> 버튼을 눌러주세요.</p>
        </div>

        <!-- 💡 우측: 결과 패널 -->
        <div class="right-content" id="resultWrapper">
            
            <div class="result-panel">
                <h2 style="margin:0 0 20px 0; font-size:1.4rem; font-weight:900; color:white;">교시별 최적 교체 추천</h2>
                <div id="accordionContainer"></div>
            </div>

            <div class="form-viewer">
                <h2>결·보강 수업 대체원 작성 가이드</h2>
                
                <div class="alert-box">
                    ⚠️ 수업 교체 안내에 오류가 있을 수 있습니다. 꼭 시간표 원본을 확인하세요.
                </div>
                
                <table class="hwp-table">
                    <thead>
                        <tr>
                            <th style="width:12%">결강과목</th>
                            <th style="width:10%">일자</th>
                            <th style="width:7%">교시</th>
                            <th style="width:11%">학년과반</th>
                            <th style="width:12%">결강교사(서명)</th>
                            <th style="width:12%">교체과목</th>
                            <th style="width:10%">일자</th>
                            <th style="width:7%">교시</th>
                            <th style="width:19%">교체교사(서명)</th>
                        </tr>
                    </thead>
                    <tbody id="unifiedHwpTbody">
                        <!-- 자동 삽입 -->
                    </tbody>
                </table>

                <div style="text-align: center; margin-top: 25px;">
                    <button class="btn purple" style="padding: 14px 25px; font-size: 1.1rem; width: 100%;" onclick="runFinalValidation()">
                        ✔️ 최종 오류 검토 (중복/누락 확인)
                    </button>
                </div>
                <div class="validation-box" id="validationResultBox"></div>
            </div>
        </div>
    </div>

    <script>
        let teacherSchedules = []; 
        let availableDays = ["월", "화", "수", "목", "금"];
        let dayToNum = { "월": 1, "화": 2, "수": 3, "목": 4, "금": 5 };
        let numToDay = { 1: "월", 2: "화", 3: "수", 4: "목", 5: "금" };

        let currentSelectedSwaps = {}; 
        let periodCandidatesMap = {}; 
        const SEMESTER_END_DATE = new Date("2027-01-07"); // 학기 종료일 지정

        // 담임 선생님 명단
        const homeroomTeachers = ["조태일", "주원창", "배하영", "도병화", "여금복", "신동분", "오시우", "양담경", "안진희", "김종호", "김주리", "김옥희", "황영준", "최민성", "조향숙", "현경호", "신수원", "이푸름"];

        function parseClassInfo(str) {
            if(!str) return { room: "-", sub: "-" };
            const parts = str.trim().split(/\s+/);
            return parts.length >= 2 ? { room: parts[0], sub: parts.slice(1).join(" ") } : { room: "전학급", sub: str };
        }

        const excelUpload = document.getElementById('excelUpload');
        const uploadLabel = document.getElementById('uploadLabel');
        const searchPanel = document.getElementById('searchPanel');
        const teacherSelect = document.getElementById('teacherSelect');
        const dateInputsContainer = document.getElementById('dateInputsContainer');
        const classCheckboxContainer = document.getElementById('classCheckboxContainer');
        const dynamicCheckboxArea = document.getElementById('dynamicCheckboxArea');
        const searchBtn = document.getElementById('searchBtn');
        const emptyStatePanel = document.getElementById('emptyStatePanel');
        const resultWrapper = document.getElementById('resultWrapper');
        const accordionContainer = document.getElementById('accordionContainer');
        const resetBtn = document.getElementById('resetBtn');
        const extendSearchWrapper = document.getElementById('extendSearchWrapper');
        const extendSearchCb = document.getElementById('extendSearchCb');

        document.addEventListener('DOMContentLoaded', () => {
            addDateInput();
            loadDefaultTimetable();
        });

        function loadDefaultTimetable() {
            fetch('timetable.xlsx')
                .then(response => {
                    if (!response.ok) throw new Error("서버 기본 파일(timetable.xlsx)을 찾을 수 없습니다.");
                    return response.arrayBuffer();
                })
                .then(data => {
                    const workbook = XLSX.read(new Uint8Array(data), { type: 'array' });
                    parseSchoolExcel(workbook); 
                    uploadLabel.innerText = `📁 기본 시간표 자동 로드 완료 (timetable.xlsx)`;
                    uploadLabel.classList.add('loaded');
                    resetBtn.style.display = 'block';
                })
                .catch(error => {
                    loadFromStorage();
                });
        }

        function addDateInput() {
            const today = new Date();

            if (savedData) {
                try {

        excelUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                parseSchoolExcel(workbook, file.name);
                uploadLabel.innerText = `📁 업로드 성공: ${file.name}`;
                uploadLabel.classList.add('loaded');
                resetBtn.style.display = 'block';
            };
            reader.readAsArrayBuffer(file);
        });

        function parseSchoolExcel(workbook) {
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
            if (raw.length < 3) return alert("데이터가 부족합니다.");

            const dayRow = raw[0], periodRow = raw[1];
            let currentDay = "", colMap = []; 
            for (let c = 2; c < Math.max(dayRow.length, periodRow.length); c++) {
                let dayVal = String(dayRow[c] || "").trim().replace(/\n/g, "");
                if (dayVal.includes("월")) currentDay = "월"; else if (dayVal.includes("화")) currentDay = "화"; else if (dayVal.includes("수")) currentDay = "수"; else if (dayVal.includes("목")) currentDay = "목"; else if (dayVal.includes("금")) currentDay = "금";
                let pVal = String(periodRow[c] || "").trim();
                if (currentDay && pVal && !isNaN(pVal)) colMap.push({ colIdx: c, key: `${currentDay}${pVal}` });
            }

            teacherSchedules = [];
            for (let r = 2; r < raw.length; r++) {
                const row = raw[r];
                if (!row) continue;
                const teacherIdx = parseInt(String(row[0] || "").trim());
                const teacherName = String(row[1] || "").trim().replace(/\n/g, " ");
                if (!teacherName || isNaN(teacherIdx)) continue;

                let department = "보통교과", isSpecialized = false;
                if (teacherIdx >= 14) { department = "전문교과"; isSpecialized = true; }

                let scheduleObj = {};
                colMap.forEach(item => {
                    let rawContent = row[item.colIdx] !== undefined ? String(row[item.colIdx]) : "";
                    scheduleObj[item.key] = rawContent.replace(/\r\n/g, " ").replace(/\n/g, " ").trim();
                });
                teacherSchedules.push({ idx: teacherIdx, name: teacherName, department: department, isSpecialized: isSpecialized, schedule: scheduleObj });
            }
            
            saveToStorage(teacherSchedules);
            initDropdowns();
        }

        function initDropdowns() {
            teacherSelect.innerHTML = '<option value="">교사 선택</option>';
            teacherSchedules.forEach(t => { teacherSelect.appendChild(new Option(`[${t.idx}번] ${t.name}`, t.name)); });
            searchPanel.style.opacity = '1'; searchPanel.style.pointerEvents = 'auto';
            document.querySelectorAll('.absent-date-input').forEach(el => el.disabled = false);
            teacherSelect.disabled = false;
            
            emptyStatePanel.style.display = 'flex';
            resultWrapper.style.display = 'none';
        }

        function getDayOfWeek(dateStr) {
            if(!dateStr) return null;
            const dayNum = new Date(dateStr).getDay(); 
            if (dayNum === 0 || dayNum === 6) return null;
            return numToDay[dayNum];
        }

        function isFreePeriod(val, day, period, teacherName) {
            if (!val) return true;
            const clean = val.trim();
            if (clean === "" || clean === "-") return true;

            if (day === "월" && Number(period) === 1 && clean.includes("창체")) {
                if (!homeroomTeachers.includes(teacherName)) return true;
            }
            return false;
        }

        function renderCheckboxes() {
            const teacherName = teacherSelect.value;
            const dateInputRows = document.querySelectorAll('.date-input-row');
            
            let validDates = [];
            dateInputRows.forEach(row => {
                const dateInput = row.querySelector('.absent-date-input');
                const blockCb = row.querySelector('.full-day-block-cb');
                
                if(dateInput.value && getDayOfWeek(dateInput.value)) {
                    if(!validDates.find(d => d.date === dateInput.value)) {
                        validDates.push({
                            date: dateInput.value,
                            isBlock: blockCb ? blockCb.checked : false
                        });
                    }
                }
            });

            if (!teacherName || validDates.length === 0) {
                classCheckboxContainer.style.display = 'none';
                extendSearchWrapper.style.display = 'none';
                searchBtn.disabled = true;
                return;
            }

            const teacher = teacherSchedules.find(t => t.name === teacherName);
            dynamicCheckboxArea.innerHTML = '';
            let hasAnyClass = false;

            validDates.sort((a,b) => a.date.localeCompare(b.date)).forEach(item => {
                const dateStr = item.date;
                const day = getDayOfWeek(dateStr);
                const formatD = `${dateStr.substring(5,7)}.${dateStr.substring(8,10)}`;
                
                let dayHtml = `<div class="date-group-label">📅 ${formatD}(${day}) 결강 수업 ` + (item.isBlock ? `<span style="color:var(--warning); font-size:0.8rem; font-weight:normal;">[종일 결강]</span>` : ``) + `</div>`;
                dayHtml += `<div class="class-checkbox-grid">`;
                let hasClassesForDay = false;

                for (let p = 1; p <= 7; p++) {
                    const classContent = teacher ? (teacher.schedule[`${day}${p}`] || "") : "";
                    
                    if (!isFreePeriod(classContent, day, p, teacher.name)) {
                        hasClassesForDay = true;
                        hasAnyClass = true;
                        dayHtml += `
                            <label class="class-checkbox-item">
                                <input type="checkbox" name="periodCheck" value="${dateStr}|${p}" checked>
                                <strong>${p}교시</strong>: ${classContent}
                            </label>
                        `;
                    }
                }
                dayHtml += `</div>`;
                
                if(hasClassesForDay) {
                    dynamicCheckboxArea.innerHTML += dayHtml;
                } else {
                    dynamicCheckboxArea.innerHTML += dayHtml.replace('</div>', `<div style="color:var(--text-dim); font-size:0.85rem; padding:4px 0;">해당 요일은 전체 공강입니다.</div></div>`);
                }
            });

            if (validDates.length > 0) {
                classCheckboxContainer.style.display = 'block';
                extendSearchWrapper.style.display = 'block'; // 확장 검색 토글 표시
                searchBtn.disabled = !hasAnyClass;
            }
        }

        // 🌟 [핵심] 여러 날짜를 반환하도록 함수 개편 (확장 검색 기능)
        function calculateAllFutureDates(baseDateStr, targetDay, isExtended) {
            const baseDate = new Date(baseDateStr);
            let diffDays = dayToNum[targetDay] - baseDate.getDay();
            if (diffDays <= 0) diffDays += 7; 

            let results = [];
            let currentTargetDate = new Date(baseDate);
            currentTargetDate.setDate(baseDate.getDate() + diffDays);
            let currentDiff = diffDays;

            while (currentTargetDate <= SEMESTER_END_DATE) {
                const y = currentTargetDate.getFullYear();
                const m = String(currentTargetDate.getMonth() + 1).padStart(2, '0');
                const d = String(currentTargetDate.getDate()).padStart(2, '0');
                
                results.push({
                    formatted: `${m}.${d}.`,
                    diffDays: currentDiff,
                    fullDateStr: `${y}-${m}-${d}`
                });

                if (!isExtended) break; // 기본 모드면 1번만 찾고 끝

                currentTargetDate.setDate(currentTargetDate.getDate() + 7);
                currentDiff += 7;
            }
            return results;
        }

        function formatCurrentDate(dateStr) {
            if (!dateStr) return "";
            const date = new Date(dateStr);
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${m}.${d}.`;
        }

        function countTeacherClassesOnExactDate(teacherObj, exactDateStr) {
            const day = getDayOfWeek(exactDateStr);
            if(!day) return 0;
            let count = 0;
            for (let p = 1; p <= 7; p++) {
                if (!isFreePeriod(teacherObj.schedule[`${day}${p}`], day, p, teacherObj.name)) count++;
            }
            return count;
        }

        function findReplacements() {
            document.getElementById('validationResultBox').style.display = 'none'; 
            currentSelectedSwaps = {}; 
            periodCandidatesMap = {};

            const absentName = teacherSelect.value;
            const absentTeacher = teacherSchedules.find(t => t.name === absentName);
            const isExtended = extendSearchCb.checked; // 토글 확인

            const checkedBoxes = document.querySelectorAll('input[name="periodCheck"]:checked');
            if (checkedBoxes.length === 0) return alert("교체할 수업을 1개 이상 선택해주세요!");

            let checkedAbsentList = [];
            checkedBoxes.forEach(box => {
                const parts = box.value.split('|');
                const dStr = parts[0];
                const p = parseInt(parts[1]);
                const day = getDayOfWeek(dStr);
                const subject = absentTeacher ? (absentTeacher.schedule[`${day}${p}`] || "") : "";
                checkedAbsentList.push({ id: `${dStr}_${p}`, dateStr: dStr, day: day, period: p, subject: subject });
            });

            const blockedDatesSet = new Set();
            document.querySelectorAll('.date-input-row').forEach(row => {
                const dateInput = row.querySelector('.absent-date-input');
                const blockCb = row.querySelector('.full-day-block-cb');
                if (dateInput.value && blockCb && blockCb.checked) {
                    blockedDatesSet.add(dateInput.value);
                }
            });

            const absentTimeKeys = new Set(checkedAbsentList.map(c => c.id));
            accordionContainer.innerHTML = '';
            
            checkedAbsentList.forEach(absentItem => {
                const candidates = findCandidatesForMultiDay(absentTeacher, absentItem, absentTimeKeys, blockedDatesSet, isExtended);
                periodCandidatesMap[absentItem.id] = candidates;
            });

            let usedTargetSlots = new Set(); 
            let usedAbsentSlots = new Set(); 

            checkedAbsentList.forEach(absentItem => {
                const candidates = periodCandidatesMap[absentItem.id];
                let bestCand = null;
                
                for (let c of candidates) {
                    if (c.isChangche) {
                        bestCand = c;
                        break;
                    }
                    if (!usedTargetSlots.has(c.targetSlotKey) && !usedAbsentSlots.has(c.absentSlotKey)) {
                        bestCand = c;
                        break;
                    }
                }

                if (bestCand) {
                    currentSelectedSwaps[absentItem.id] = bestCand;
                    if (!bestCand.isChangche) {
                        usedTargetSlots.add(bestCand.targetSlotKey);
                        usedAbsentSlots.add(bestCand.absentSlotKey);
                    }
                }
            });

            emptyStatePanel.style.display = 'none';
            resultWrapper.style.display = 'flex';

            checkedAbsentList.forEach(absentItem => {
                renderAccordionItem(absentItem, periodCandidatesMap[absentItem.id]);
            });

            updateCandidateLocks();
            generateUnifiedHWPPreview();
            
            if (window.innerWidth <= 1100) {
                resultWrapper.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // 🌟 여러 날짜 지원하는 탐색 함수
        function findCandidatesForMultiDay(absentTeacher, absentItem, absentTimeKeys, blockedDatesSet, isExtended) {
            const { dateStr, day, period, subject } = absentItem;
            const targetKey = `${day}${period}`;
            
            if (subject.includes("창체")) {
                const m = String(new Date(dateStr).getMonth() + 1).padStart(2, '0');
                const d = String(new Date(dateStr).getDate()).padStart(2, '0');
                
                return [{
                    id: `cand_${absentItem.id}_부담임_창체`,
                    targetSlotKey: `부담임_창체_none`, 
                    absentSlotKey: `창체_결강_none`, 
                    type: 'direct',
                    absentItem: absentItem,
                    targetTeacherName: "부담임",
                    dept: "특별배정",
                    swapDay: day,
                    swapPeriod: period,
                    swapDateFormatted: `${m}.${d}.`,
                    exactTargetDate: dateStr,
                    diffDays: 0,
                    swapSubject: subject, 
                    totalTargetClasses: 0, 
                    totalAbsentClasses: 0, 
                    isPE: false,
                    isChangche: true
                }];
            }

            const isAbsentClassNative = subject.includes("원어민");
            const absentRoom = parseClassInfo(subject).room; 
            
            let candidates = [];

            teacherSchedules.forEach(targetTeacher => {
                if (targetTeacher.name === absentTeacher.name) return;

                if (isFreePeriod(targetTeacher.schedule[targetKey], day, period, targetTeacher.name)) {
                    if (!absentTeacher.isSpecialized && !targetTeacher.isSpecialized && !isAbsentClassNative) {
                        availableDays.forEach(d => {
                            for (let p = 1; p <= 7; p++) {
                                const targetClass = targetTeacher.schedule[`${d}${p}`];
                                const absentIsFree = isFreePeriod(absentTeacher.schedule[`${d}${p}`], d, p, absentTeacher.name);

                                if (!isFreePeriod(targetClass, d, p, targetTeacher.name) && absentIsFree) {
                                    if (targetClass.includes("원어민")) continue;
                                    
                                    const targetRoom = parseClassInfo(targetClass).room;
                                    if (absentRoom !== targetRoom) continue; 

                                    // 🔥 [수정] 조건에 따라 단일 날짜 혹은 학기말까지의 날짜 배열 생성
                                    const dateDetailsList = calculateAllFutureDates(dateStr, d, isExtended);
                                    
                                    dateDetailsList.forEach(dateDetails => {
                                        const exactTargetDate = dateDetails.fullDateStr;

                                        if (blockedDatesSet.has(exactTargetDate)) return; 
                                        if (absentTimeKeys.has(`${exactTargetDate}_${p}`)) return; 

                                        const absentSlotKey = `${exactTargetDate}_${p}`;
                                        const targetSlotKey = `${targetTeacher.name}_${exactTargetDate}_${p}`;

                                        const totalTargetClasses = countTeacherClassesOnExactDate(targetTeacher, dateStr) + 1;
                                        const totalAbsentClasses = countTeacherClassesOnExactDate(absentTeacher, exactTargetDate) + 1;

                                        candidates.push({
                                            id: `cand_${absentItem.id}_${targetTeacher.name}_${exactTargetDate}_${p}`,
                                            targetSlotKey: targetSlotKey,
                                            absentSlotKey: absentSlotKey,
                                            type: 'direct',
                                            absentItem: absentItem, 
                                            targetTeacherName: targetTeacher.name,
                                            dept: targetTeacher.department,
                                            swapDay: d,
                                            swapPeriod: p,
                                            swapDateFormatted: dateDetails.formatted,
                                            exactTargetDate: exactTargetDate,
                                            diffDays: dateDetails.diffDays,
                                            swapSubject: targetClass,
                                            totalTargetClasses: totalTargetClasses,
                                            totalAbsentClasses: totalAbsentClasses,
                                            isPE: targetClass.includes("체육"),
                                            isChangche: false
                                        });
                                    });
                                }
                            }
                        });
                    }
                }
            });

            candidates.sort((a, b) => {
                if (a.diffDays !== b.diffDays) return a.diffDays - b.diffDays;
                return a.totalTargetClasses - b.totalTargetClasses;
            });

            return candidates;
        }

        function renderAccordionItem(absentItem, candidates) {
            const formatD = `${absentItem.dateStr.substring(5,7)}.${absentItem.dateStr.substring(8,10)}`;
            const itemId = `accordion-item-${absentItem.id}`;
            const selectedCand = currentSelectedSwaps[absentItem.id];

            let headerSubText = "";
            if (selectedCand) {
                if (selectedCand.isChangche) {
                    headerSubText = `추천: <strong style="color:white;">부담임</strong> 대강 고정 (${selectedCand.swapDateFormatted}(${selectedCand.swapDay}) ${selectedCand.swapPeriod}교시 [${selectedCand.swapSubject}])`;
                } else {
                    let targetWorkload = getWorkloadBadge(selectedCand.totalTargetClasses, '상대');
                    let myWorkload = getMyWorkloadBadge(selectedCand.totalAbsentClasses);
                    headerSubText = `추천: <strong style="color:white;">${selectedCand.targetTeacherName}</strong> 교사 (${selectedCand.swapDateFormatted}(${selectedCand.swapDay}) ${selectedCand.swapPeriod}교시 [${selectedCand.swapSubject}]) ${targetWorkload} ${myWorkload}`;
                }
            } else {
                headerSubText = `<span style="color:var(--danger);">동일 학급(반) 교체 가능한 선생님이 없습니다. (심층교체 확인)</span>`;
            }

            let html = `
                <div class="accordion-item" id="${itemId}">
                    <div class="accordion-header" onclick="toggleAccordion('${absentItem.id}')">
                        <div>
                            <div class="accordion-title">
                                <span>📌 ${formatD}(${absentItem.day}) ${absentItem.period}교시 [${absentItem.subject}]</span>
                            </div>
                            <div class="accordion-sub" id="accordion-sub-${absentItem.id}">${headerSubText}</div>
                        </div>
                        <div class="accordion-icon">▼</div>
                    </div>
                    <div class="accordion-body">
            `;

            if (candidates.length > 0) {
                html += `<ul class="candidate-list">`;
                candidates.forEach((c, idx) => {
                    let targetWorkload = c.isChangche ? `<span class="tag-special">고정 배정</span>` : getWorkloadBadge(c.totalTargetClasses, '상대');
                    let myWorkload = c.isChangche ? '' : getMyWorkloadBadge(c.totalAbsentClasses);
                    let peAlert = c.isPE ? `<span style="color:#fbbf24; font-size:0.8rem; margin-left:6px;">⚠️ 체육관 확인</span>` : '';
                    let rankLabel = idx === 0 ? `<span class="tag-rank1" style="margin-right:4px;">최우선 추천</span>` : '';

                    html += `
                        <li class="candidate-card" id="card-${c.id}">
                            <div>
                                <div class="t-name">
                                    ${rankLabel} ${c.targetTeacherName} ${c.isChangche ? '' : `<span class="dept-tag dept-gen">${c.dept}</span>`}
                                    ${targetWorkload} ${myWorkload}
                                </div>
                                <div class="t-tag">
                                    ${c.isChangche ? '대강 수업:' : '교체 수업:'} <strong>${c.swapDateFormatted}(${c.swapDay}) ${c.swapPeriod}교시 [${c.swapSubject}]</strong> ${peAlert}
                                </div>
                                <div class="lock-msg" style="margin-top:4px;"></div>
                            </div>
                            <button class="btn action action-btn" style="padding:10px 16px; font-size:0.9rem; ${c.isChangche ? 'display:none;' : ''}" 
                                onclick="selectCandidateOption('${absentItem.id}', '${c.id}')">
                                이 옵션으로 교체 🔄
                            </button>
                            ${c.isChangche ? `<span style="color:var(--success); font-weight:bold; font-size:0.9rem;">선택됨 ✅</span>` : ''}
                        </li>
                    `;
                });
                html += `</ul>`;
            } else {
                html += `
                    <div class="deep-swap-box" id="deep-swap-box-${absentItem.id}">
                        <div style="font-weight:800; color:#c084fc; margin-bottom:10px;">💡 심층 교체(3자 연쇄)를 진행하시겠습니까?</div>
                        <button class="btn purple" style="width:100%; padding:14px;" onclick="runDeepSwapForPeriod('${absentItem.id}')">
                            3자 간 연쇄 교체 경로 찾기 ➔
                        </button>
                    </div>
                `;
            }

            html += `</div></div>`;
            accordionContainer.innerHTML += html;
        }

        function toggleAccordion(absentId) {
            const item = document.getElementById(`accordion-item-${absentId}`);
            item.classList.toggle('active');
        }

        function getWorkloadBadge(totalClasses, prefix = '') {
            const label = prefix ? `${prefix} ` : '';
            if (totalClasses >= 6) return `<span class="workload-badge workload-danger">🚨 ${label}${totalClasses}시간</span>`;
            else if (totalClasses === 5) return `<span class="workload-badge workload-heavy">⚠️ ${label}${totalClasses}시간</span>`;
            else return `<span class="workload-badge workload-normal">${label}${totalClasses}시간</span>`;
        }

        function getMyWorkloadBadge(totalClasses) {
            if (totalClasses >= 6) return `<span class="workload-badge workload-danger">🚨 내 당일 ${totalClasses}시간</span>`;
            else if (totalClasses === 5) return `<span class="workload-badge workload-heavy">⚠️ 내 당일 ${totalClasses}시간</span>`;
            else return `<span class="my-workload-badge">내 당일 ${totalClasses}시간</span>`;
        }

        function updateCandidateLocks() {
            for (let absentId in periodCandidatesMap) {
                const candidates = periodCandidatesMap[absentId];
                
                candidates.forEach(c => {
                    const card = document.getElementById(`card-${c.id}`);
                    if (!card) return;
                    
                    if (c.isChangche) {
                        card.classList.remove('locked-card');
                        return; 
                    }

                    const btn = card.querySelector('.action-btn');
                    const lockMsgElem = card.querySelector('.lock-msg');
                    
                    let isConflict = false;
                    let conflictMsg = "";

                    for (let otherId in currentSelectedSwaps) {
                        if (otherId !== absentId) {
                            const otherSel = currentSelectedSwaps[otherId];
                            if (otherSel && otherSel.type === 'direct' && !otherSel.isChangche) {
                                if (otherSel.absentSlotKey === c.absentSlotKey) {
                                    isConflict = true;
                                    conflictMsg = `🔒 선생님의 이 빈 시간은 다른 결강건(보강)으로 채워졌습니다.`;
                                    break;
                                }
                                if (otherSel.targetSlotKey === c.targetSlotKey) {
                                    isConflict = true;
                                    conflictMsg = `🔒 상대 선생님의 이 수업은 이미 교체 배정됨.`;
                                    break;
                                }
                            }
                        }
                    }

                    if (isConflict) {
                        card.classList.add('locked-card');
                        card.classList.remove('selected');
                        btn.disabled = true;
                        btn.className = 'btn secondary action-btn';
                        btn.innerText = '선택 불가';
                        lockMsgElem.innerHTML = `<span style="color:#ef4444; font-size:0.85rem; font-weight:bold;">${conflictMsg}</span>`;
                    } else {
                        card.classList.remove('locked-card');
                        btn.disabled = false;
                        
                        const currentSel = currentSelectedSwaps[absentId];
                        if (currentSel && currentSel.id === c.id) {
                            card.classList.add('selected');
                            btn.className = 'btn secondary action-btn';
                            btn.innerText = '선택됨 ✅';
                        } else {
                            card.classList.remove('selected');
                            btn.className = 'btn action action-btn';
                            btn.innerText = '이 옵션으로 교체 🔄';
                        }
                        lockMsgElem.innerHTML = '';
                    }
                });
            }
        }

        function selectCandidateOption(absentId, candidateId) {
            const candidates = periodCandidatesMap[absentId];
            const selectedCandidate = candidates.find(c => c.id === candidateId);
            if (!selectedCandidate) return;

            currentSelectedSwaps[absentId] = selectedCandidate;
            document.getElementById('validationResultBox').style.display = 'none';

            const subElem = document.getElementById(`accordion-sub-${absentId}`);
            let targetWorkload = getWorkloadBadge(selectedCandidate.totalTargetClasses, '상대');
            let myWorkload = getMyWorkloadBadge(selectedCandidate.totalAbsentClasses);
            subElem.innerHTML = `선택: <strong style="color:white;">${selectedCandidate.targetTeacherName}</strong> 교사 (${selectedCandidate.swapDateFormatted}(${selectedCandidate.swapDay}) ${selectedCandidate.swapPeriod}교시 [${selectedCandidate.swapSubject}]) ${targetWorkload} ${myWorkload}`;

            updateCandidateLocks();
            generateUnifiedHWPPreview();
            
            const accordionItem = document.getElementById(`accordion-item-${absentId}`);
            if (accordionItem) accordionItem.classList.remove('active'); 
        }

        function runDeepSwapForPeriod(absentId) {
            const absentName = teacherSelect.value;
            const absentTeacher = teacherSchedules.find(t => t.name === absentName);
            const box = document.getElementById(`deep-swap-box-${absentId}`);
            
            const parts = absentId.split('_');
            const dStr = parts[0];
            const p = parseInt(parts[1]);
            const day = getDayOfWeek(dStr);

            const chains = findDeepSwapsForPeriod(absentTeacher, day, p, dStr);

            if (chains.length === 0) {
                box.innerHTML = `<div style="color:var(--danger); text-align:center; font-weight:bold;">❌ 동일 학급을 들어가는 선생님들 중 조건에 맞는 연쇄 조합이 없습니다.</div>`;
            } else {
                let html = `<div style="font-weight:800; color:#c084fc; margin-bottom:12px;">💡 3자 연쇄 추천 경로</div>`;
                chains.forEach((c) => {
                    html += `
                        <div style="background:rgba(0,0,0,0.3); padding:14px; border-radius:10px; margin-bottom:10px;">
                            • <strong>1단계</strong>: ${c.teacherB} 교사가 ${absentName} 교사의 결강 시간 대강<br>
                            • <strong>2단계</strong>: ${c.teacherC} 교사가 ${c.teacherB} 교사의 ${c.timeB}교시 [${c.classB}] 대강<br>
                            • <strong>3단계</strong>: ${absentName} 교사가 ${c.teacherC} 교사의 ${c.timeC}교시 [${c.classC}] 대강
                            <br>
                            <button class="btn purple" style="padding:8px 15px; margin-top:10px;"
                                onclick="selectDeepSwapOption('${absentId}', '${absentName}', '${c.teacherB}', '${c.teacherC}', '${c.timeB}', '${c.classB}', '${c.timeC}', '${c.classC}', '${dStr}', '${day}', '${p}')">
                                이 경로 선택 🔄
                            </button>
                        </div>
                    `;
                });
                box.innerHTML = html;
            }
        }

        function findDeepSwapsForPeriod(absentTeacher, day, period, dateStr) {
            const targetKey = `${day}${period}`;
            const absentClass = absentTeacher.schedule[targetKey] || "";
            if (absentClass.includes("원어민") || absentTeacher.isSpecialized) return [];
            
            const absentRoom = parseClassInfo(absentClass).room;
            let deepChains = [];

            teacherSchedules.forEach(teacherB => {
                if (teacherB.name === absentTeacher.name || teacherB.isSpecialized) return;
                
                if (isFreePeriod(teacherB.schedule[targetKey], day, period, teacherB.name)) {
                    availableDays.forEach(dB => {
                        for (let pB = 1; pB <= 7; pB++) {
                            const keyB = `${dB}${pB}`;
                            const classB = teacherB.schedule[keyB];
                            
                            if (!isFreePeriod(classB, dB, pB, teacherB.name) && !classB.includes("원어민") && parseClassInfo(classB).room === absentRoom) {
                                teacherSchedules.forEach(teacherC => {
                                    if (teacherC.name === absentTeacher.name || teacherC.name === teacherB.name || teacherC.isSpecialized) return;
                                    if (isFreePeriod(teacherC.schedule[keyB], dB, pB, teacherC.name)) {
                                        availableDays.forEach(dC => {
                                            for (let pC = 1; pC <= 7; pC++) {
                                                const keyC = `${dC}${pC}`;
                                                const classC = teacherC.schedule[keyC];
                                                
                                                const absentIsFreeAtC = isFreePeriod(absentTeacher.schedule[keyC], dC, pC, absentTeacher.name);
                                                if (!isFreePeriod(classC, dC, pC, teacherC.name) && absentIsFreeAtC && !classC.includes("원어민") && parseClassInfo(classC).room === absentRoom) {
                                                    deepChains.push({
                                                        teacherB: teacherB.name, classB: classB, timeB: `${dB}${pB}`,
                                                        teacherC: teacherC.name, classC: classC, timeC: `${dC}${pC}`
                                                    });
                                                }
                                            }
                                        });
                                    }
                                });
                            }
                        }
                    });
                }
            });
            return deepChains.slice(0, 2);
        }

        function selectDeepSwapOption(absentId, absentName, teacherB, teacherC, timeB, classB, timeC, classC, dStr, day, p) {
            currentSelectedSwaps[absentId] = {
                type: 'deep', absentName: absentName, teacherB: teacherB, teacherC: teacherC,
                timeB: timeB, classB: classB, timeC: timeC, classC: classC, 
                absentItem: { dateStr: dStr, day: day, period: p, subject: teacherSchedules.find(t => t.name === absentName)?.schedule[`${day}${p}`] || "" }
            };
            const subElem = document.getElementById(`accordion-sub-${absentId}`);
            subElem.innerHTML = `<span style="color:#c084fc;">선택됨: 3자 연쇄 경로 (${teacherB} ➔ ${teacherC} ➔ ${absentName})</span>`;
            
            document.getElementById('validationResultBox').style.display = 'none';
            updateCandidateLocks();
            generateUnifiedHWPPreview();
            
            const accordionItem = document.getElementById(`accordion-item-${absentId}`);
            if (accordionItem) accordionItem.classList.remove('active'); 
        }

        function generateUnifiedHWPPreview() {
            const keys = Object.keys(currentSelectedSwaps);
            if (keys.length === 0) return;

            const absentName = teacherSelect.value;
            const tbody = document.getElementById('unifiedHwpTbody');
            tbody.innerHTML = '';

            keys.sort();

            keys.forEach(id => {
                const item = currentSelectedSwaps[id];
                if (!item || !item.absentItem) return;

                const absentItem = item.absentItem;
                const origDateFormatted = formatCurrentDate(absentItem.dateStr);
                const orig = parseClassInfo(absentItem.subject);

                if (item.type === 'direct') {
                    tbody.innerHTML += `
                        <tr>
                            <td>${orig.sub}</td>
                            <td>${origDateFormatted}(${absentItem.day})</td>
                            <td>${absentItem.period}교시</td>
                            <td>${orig.room}</td>
                            <td>${absentName}</td>
                            <td>${item.swapSubject}</td>
                            <td>${item.swapDateFormatted}(${item.swapDay})</td>
                            <td>${item.swapPeriod}교시</td>
                            <td style="color:#0284c7; font-weight:bold;">${item.targetTeacherName}</td>
                        </tr>
                    `;
                } else if (item.type === 'deep') {
                    tbody.innerHTML += `
                        <tr style="background-color:rgba(239, 68, 68, 0.05);">
                            <td colspan="9" style="text-align:left; padding:12px 15px; font-size:0.95rem; line-height: 1.6;">
                                💡 <strong style="color:var(--danger);">[${origDateFormatted}(${absentItem.day}) ${absentItem.period}교시 3자 연쇄]</strong><br>
                                • ${item.teacherB} 교사가 ${absentName} 교사의 결강 시간 대강<br>
                                • ${item.teacherC} 교사가 ${item.teacherB} 교사의 ${item.timeB}교시 [${item.classB}] 대강<br>
                                • ${absentName} 교사가 ${item.teacherC} 교사의 ${item.timeC}교시 [${item.classC}] 대강
                            </td>
                        </tr>
                    `;
                }
            });
        }

        function runFinalValidation() {
            let errors = [];
            const checkedBoxes = document.querySelectorAll('input[name="periodCheck"]:checked');
            
            if (Object.keys(currentSelectedSwaps).length < checkedBoxes.length) {
                errors.push("⚠️ 결강 수업 중 대체 교사가 배정되지 않은 빈 슬롯이 있습니다!");
            }

            let scheduleTracker = {}; 
            const absentName = teacherSelect.value;

            for (let id in currentSelectedSwaps) {
                const item = currentSelectedSwaps[id];
                
                if (item.isChangche) continue;

                const origDate = item.absentItem.dateStr;
                const origPeriod = item.absentItem.period;

                if (item.type === 'direct') {
                    const key1 = `${item.targetTeacherName}_${origDate}_${origPeriod}`;
                    if(scheduleTracker[key1]) {
                        errors.push(`🚫 [중복 오류] ${item.targetTeacherName} 교사가 ${origDate} ${origPeriod}교시에 두 번 배정되었습니다!`);
                    }
                    scheduleTracker[key1] = true;

                    const key2 = `${absentName}_${item.exactTargetDate}_${item.swapPeriod}`;
                    if(scheduleTracker[key2]) {
                        errors.push(`🚫 [중복 오류] 본인(${absentName})이 ${item.exactTargetDate} ${item.swapPeriod}교시에 두 곳의 교실에 배정되었습니다!`);
                    }
                    scheduleTracker[key2] = true;
                }
            }

            const validationBox = document.getElementById('validationResultBox');
            if (errors.length > 0) {
                validationBox.innerHTML = `<div style="color:var(--danger); font-size:1.1rem; margin-bottom:8px;">[발견된 오류]</div>` + errors.join("<br>");
                validationBox.style.background = "rgba(239, 68, 68, 0.1)";
                validationBox.style.border = "2px solid rgba(239, 68, 68, 0.5)";
            } else {
                validationBox.innerHTML = `<div style="color:var(--success); font-size:1.2rem;">✅ 완벽합니다! 중복되거나 누락된 수업이 없습니다.</div>`;
                validationBox.style.background = "rgba(16, 185, 129, 0.1)";
                validationBox.style.border = "2px solid rgba(16, 185, 129, 0.5)";
            }
            validationBox.style.display = "block";
            validationBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    </script>
</body>
</html>
